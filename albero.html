<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IANNECE di Aquilonia — Albero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="api.js" defer></script>
  <script src="albero.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>
    body{font-family:Inter,sans-serif;background:#f9f9ff}
    h1,h2,h3{font-family:'Playfair Display',serif}
    .tree-node{min-width:136px}
    .tree-stage{transform-origin:center top;transition:transform .2s;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
    .tree-viewport{touch-action:none;overscroll-behavior:contain;cursor:grab;-webkit-user-select:none;user-select:none}
    .tree-viewport.dragging{cursor:grabbing}
  </style>
</head>
<body class="pb-24">
  <header class="sticky top-0 z-50 bg-[#f9f9ff] flex justify-center px-4 py-3 border-b border-gray-200">
    <h1 class="text-xl font-bold text-[#4a5d4e]">IANNECE di Aquilonia</h1>
  </header>
  <main class="w-full px-2 sm:px-4">
    <h2 class="text-3xl font-bold mt-4 text-center">Albero genealogico</h2>
    <p id="tree-center" class="text-sm text-gray-500 text-center mb-4">Caricamento…</p>
    <div class="flex flex-wrap justify-center gap-2 mb-4">
      <button id="ancestors" class="bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm">Antenati · 1</button>
      <button id="descendants" class="bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm">Discendenti · 1</button>
      <button id="center-tree" class="bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm">Centra</button>
      <button id="reset-tree" class="bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm">Reset</button>
      <button id="zoom-out" aria-label="Riduci zoom" class="bg-white border border-gray-200 rounded-xl px-4 py-2">−</button>
      <button id="zoom-in" aria-label="Aumenta zoom" class="bg-white border border-gray-200 rounded-xl px-4 py-2">+</button>
    </div>
    <div id="tree-layout" class="flex gap-4 items-stretch">
      <div id="tree-column" class="min-w-0 flex-1">
        <div id="tree-viewport" class="tree-viewport bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden min-h-[420px] h-[calc(100vh-250px)] p-4 sm:p-6">
          <div id="tree-stage" class="tree-stage min-w-max text-center" aria-live="polite"></div>
        </div>
      </div>
      <aside id="person-panel" hidden class="w-[min(420px,36vw)] shrink-0 bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden h-[calc(100vh-250px)] min-h-[420px]" aria-label="Scheda personale">
        <div class="h-12 px-3 border-b border-gray-100 flex items-center justify-between">
          <strong class="text-sm text-[#4a5d4e]">Scheda personale</strong>
          <button id="close-person-panel" type="button" class="material-symbols-outlined text-gray-600" aria-label="Chiudi scheda personale">close</button>
        </div>
        <iframe id="person-panel-frame" title="Scheda personale" class="w-full h-[calc(100%-3rem)] border-0" loading="lazy"></iframe>
      </aside>
    </div>
  </main>
  <nav aria-label="Navigazione principale" class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around py-3 pb-6 px-2 z-50">
    <a href="index.html" class="flex flex-col items-center text-gray-400"><span class="material-symbols-outlined">home</span><span class="text-[10px]">Home</span></a>
    <a href="persone.html" class="flex flex-col items-center text-gray-400"><span class="material-symbols-outlined">group</span><span class="text-[10px]">Persone</span></a>
    <a href="albero.html" aria-current="page" class="flex flex-col items-center text-[#4a5d4e] font-bold"><span class="material-symbols-outlined">account_tree</span><span class="text-[10px]">Albero</span></a>
    <a href="rami.html" class="flex flex-col items-center text-gray-400"><span class="material-symbols-outlined">family_history</span><span class="text-[10px]">Rami</span></a>
    <a href="cronologia.html" class="flex flex-col items-center text-gray-400"><span class="material-symbols-outlined">history</span><span class="text-[10px]">Cronologia</span></a>
  </nav>
</body>
</html>
